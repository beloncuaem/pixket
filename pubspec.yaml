name: pixket
description: "Pixket - Nhật ký chi tiêu pixel"
publish_to: 'none'
version: 2.4.0+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  camera: ^0.11.1
  image_picker: ^1.1.2
  flutter_riverpod: ^2.6.1
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.5
  share_plus: ^13.3.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/

  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
